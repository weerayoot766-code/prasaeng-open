<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมาชิกพระแสงเดลิเวอรี่</title>

<style>
:root{
  --rose:#ff2f92;
  --rose-dark:#d1067c;
  --rose-light:#fdf0f4;
  --gold:#c9a44c;
  --gold-light:#f3e6c8;
  --blush:#fff5f8;
}

*{ box-sizing:border-box; }

body{
  font-family:Arial, "Segoe UI", sans-serif;
  font-size:16px;
  background:linear-gradient(180deg,var(--blush),#fdf0f4 40%,#fbeaf1);
  min-height:100vh;
  padding:18px 14px 40px;
  color:#3a2130;
  margin:0;
}

.back-btn{
  display:inline-block;
  background:rgba(157,23,77,.08);
  color:var(--rose);
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:14px;
}

.wrap{ max-width:520px; margin:0 auto; }

/* ---------- Card ---------- */
.card{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 6px 20px rgba(157,23,77,.08);
  border:1px solid #f6dbe6;
}

/* ---------- Login gate ---------- */
.login-hero{
  text-align:center;
  padding:8px 0 20px;
}
.login-hero .badge{
  width:72px; height:72px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#e9cf8f);
  display:flex; align-items:center; justify-content:center;
  font-size:34px; margin:0 auto 12px;
  box-shadow:0 4px 14px rgba(201,164,76,.4);
}
.login-hero h1{
  color:var(--rose-dark);
  font-size:22px;
  margin:0 0 4px;
}
.login-hero p{
  color:#a3134f;
  font-size:13.5px;
  opacity:.8;
  margin:0;
}

label{ display:block; font-size:13px; font-weight:bold; color:#7a3a55; margin:14px 0 6px; }
input{
  width:100%; padding:13px 14px; border-radius:12px;
  border:1.5px solid #f0cfdd; font-size:15px; background:#fffafc;
  color:#3a2130;
}
input:focus{ outline:none; border-color:var(--rose); }

button{
  width:100%;
  border:none; border-radius:12px;
  padding:14px; font-size:15.5px; font-weight:bold;
  cursor:pointer; margin-top:10px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),#ff5cad);
  color:#fff;
  box-shadow:0 6px 16px rgba(157,23,77,.28);
}
.btn-secondary{
  background:#fff;
  color:var(--rose);
  border:1.5px solid var(--rose);
}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#dcbd6e);
  color:#5a4413;
}

.toggle-row{ text-align:center; margin-top:16px; font-size:13.5px; color:#8a5a70; }
.toggle-row a{ color:var(--rose); font-weight:bold; text-decoration:none; cursor:pointer; }

.error-msg{
  background:#fdeaf1; color:#b3184f; border-radius:10px;
  padding:10px 12px; font-size:13.5px; margin-bottom:10px;
}

/* ---------- Member header ---------- */
.member-header{
  background:linear-gradient(135deg,var(--rose),#ff5cad 55%,var(--rose-dark));
  border-radius:22px;
  padding:24px 22px;
  color:#fff;
  position:relative;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 10px 26px rgba(157,23,77,.25);
}
.member-header::after{
  content:"";
  position:absolute; right:-30px; top:-30px;
  width:140px; height:140px; border-radius:50%;
  background:rgba(255,255,255,.08);
}
.member-header::before{
  content:"";
  position:absolute; right:30px; bottom:-40px;
  width:100px; height:100px; border-radius:50%;
  background:rgba(201,164,76,.18);
}
.member-header .kicker{
  font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--gold-light); font-weight:bold; opacity:.9;
}
.member-header h2{ margin:6px 0 2px; font-size:22px; }
.member-header .phone{ font-size:13.5px; opacity:.85; }
.member-header .logout-btn{
  position:relative; z-index:2;
  width:auto; margin-top:16px;
  background:rgba(255,255,255,.16);
  color:#fff; font-size:12.5px; padding:8px 14px;
  border:1px solid rgba(255,255,255,.35);
}

.section-title{
  display:flex; align-items:center; gap:8px;
  color:var(--rose-dark); font-size:17px; margin:0 0 14px;
}

/* ---------- Coupons ---------- */
.coupon-card{
  position:relative;
  background:linear-gradient(135deg,#fff,#fff9ef);
  border:1.5px dashed var(--gold);
  border-radius:16px;
  padding:16px 16px 16px 18px;
  margin-bottom:14px;
}
.coupon-card::before{
  content:"🎟️";
  position:absolute; top:-10px; left:16px;
  background:var(--gold); color:#fff;
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; box-shadow:0 3px 8px rgba(201,164,76,.4);
}
.coupon-card .title{ font-weight:bold; color:#7a5a12; font-size:15px; margin:6px 0 4px; }
.coupon-card .expiry{ font-size:12px; color:#a08340; margin-bottom:10px; }
.coupon-card button{ margin-top:0; }

.empty-state{
  text-align:center; color:#b57a95; font-size:14px; padding:20px 10px;
}

/* ---------- Order history ---------- */
.order-card{
  border:1px solid #f6dbe6; border-radius:16px;
  padding:14px 16px; margin-bottom:12px;
  background:#fffdfd;
}
.order-card .top-row{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:6px;
}
.order-card .order-id{ font-weight:bold; color:var(--rose-dark); font-size:14.5px; }
.order-card .datetime{ font-size:12px; color:#a3839a; }
.order-card .shop{ font-size:13.5px; color:#6b4457; margin-bottom:6px; }
.order-card .items{
  font-size:12.5px; color:#8a6a79; white-space:pre-line;
  background:#fbeef3; border-radius:10px; padding:8px 10px; margin-bottom:8px;
  max-height:90px; overflow:auto;
}
.order-card .bottom-row{
  display:flex; justify-content:space-between; align-items:center;
}
.order-card .total{ font-weight:bold; color:var(--rose); font-size:15px; }
.status-badge{
  font-size:11.5px; font-weight:bold; padding:5px 10px; border-radius:20px;
  background:#f3e6c8; color:#7a5a12; white-space:nowrap;
}
.status-badge.done{ background:#e3f6e8; color:#1a9c52; }
.status-badge.waiting{ background:#fdeaea; color:#d63333; }

.loading-text{ text-align:center; color:#c48aa2; font-size:14px; padding:16px 0; }
</style>
</head>
<body>

<div class="wrap">
  <button class="back-btn" onclick="goHome()">← กลับหน้าแรก</button>
  <div id="app"></div>
</div>

<script src="api.js"></script>
<script>

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function goHome(){
  window.location.href = "index.html";
}

let showingRegister = false;

function loadHome(){
  const phone = localStorage.getItem("pd_memberPhone");
  const name = localStorage.getItem("pd_memberName");
  if(phone && name){
    renderDashboard(name, phone);
  } else {
    renderLoginGate();
  }
}

function renderLoginGate(message){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="login-hero">
        <div class="badge">💎</div>
        <h1>สมาชิกพระแสงเดลิเวอรี่</h1>
        <p>คูปองส่วนลด · ประวัติการสั่งซื้อ · สิทธิพิเศษสมาชิก</p>
      </div>
      ${message ? '<div class="error-msg">' + escapeHtml(message) + '</div>' : ''}
      <div id="memberFormBox"></div>
      <div class="toggle-row">
        <span id="toggleText">ยังไม่เป็นสมาชิก? <a onclick="toggleForm()">สมัครสมาชิกใหม่</a></span>
      </div>
    </div>
  `;
  renderForm();
}

function toggleForm(){
  showingRegister = !showingRegister;
  renderForm();
  document.getElementById("toggleText").innerHTML = showingRegister
    ? 'เป็นสมาชิกอยู่แล้ว? <a onclick="toggleForm()">เข้าสู่ระบบ</a>'
    : 'ยังไม่เป็นสมาชิก? <a onclick="toggleForm()">สมัครสมาชิกใหม่</a>';
}

function renderForm(){
  const box = document.getElementById("memberFormBox");
  if(!showingRegister){
    box.innerHTML = `
      <label>📱 เบอร์โทร</label>
      <input id="loginPhone" placeholder="เช่น 0932945790">
      <label>🔒 PIN 4 หลัก</label>
      <input id="loginPin" type="password" maxlength="4" placeholder="••••">
      <button class="btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button>
    `;
  } else {
    box.innerHTML = `
      <label>👤 ชื่อของคุณ</label>
      <input id="regName" placeholder="ชื่อ-นามสกุล">
      <label>📱 เบอร์โทร</label>
      <input id="regPhone" placeholder="เช่น 0932945790">
      <label>🔒 ตั้ง PIN 4 หลัก</label>
      <input id="regPin" type="password" maxlength="4" placeholder="••••">
      <button class="btn-primary" onclick="doRegister()">สมัครสมาชิก 🎉</button>
      <p style="font-size:12px;color:#a3134f;text-align:center;margin-top:10px;opacity:.8;">
        สมัครวันนี้ รับคูปองส่วนลดค่าส่ง 50% สำหรับออเดอร์แรกทันที
      </p>
    `;
  }
}

async function doLogin(){
  const phone = document.getElementById("loginPhone").value.trim();
  const pin = document.getElementById("loginPin").value.trim();
  if(!phone || !pin){ alert("กรุณากรอกเบอร์และ PIN"); return; }

  try {
    const result = await apiGet('loginMember', { phone: phone, pin: pin });
    if(!result.success){ renderLoginGate(result.message || "เข้าสู่ระบบไม่สำเร็จ"); return; }

    localStorage.setItem("pd_memberName", result.name);
    localStorage.setItem("pd_memberPhone", result.phone);
    localStorage.setItem("pd_memberAddress", result.address || "");
    localStorage.setItem("pd_memberLat", result.lat || "");
    localStorage.setItem("pd_memberLng", result.lng || "");
    renderDashboard(result.name, result.phone);
  } catch(error){
    renderLoginGate("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
  }
}

async function doRegister(){
  const name = document.getElementById("regName").value.trim();
  const phone = document.getElementById("regPhone").value.trim();
  const pin = document.getElementById("regPin").value.trim();
  if(!name || !phone || !pin){ alert("กรุณากรอกข้อมูลให้ครบ"); return; }

  try {
    const result = await apiPost('registerMember', { data: { name: name, phone: phone, pin: pin } });
    if(!result.success){ alert(result.message || "สมัครสมาชิกไม่สำเร็จ"); return; }

    localStorage.setItem("pd_memberName", result.name);
    localStorage.setItem("pd_memberPhone", result.phone);
    localStorage.setItem("pd_memberAddress", result.address || "");
    localStorage.setItem("pd_memberLat", result.lat || "");
    localStorage.setItem("pd_memberLng", result.lng || "");
    alert("สมัครสมาชิกสำเร็จ 🎉 รับคูปองส่วนลดค่าส่ง 50% สำหรับออเดอร์แรกแล้ว!");
    renderDashboard(result.name, result.phone);
  } catch(error){
    alert("สมัครสมาชิกไม่สำเร็จ: " + error.message);
  }
}

function logout(){
  localStorage.removeItem("pd_memberName");
  localStorage.removeItem("pd_memberPhone");
  localStorage.removeItem("pd_memberAddress");
  localStorage.removeItem("pd_memberLat");
  localStorage.removeItem("pd_memberLng");
  showingRegister = false;
  renderLoginGate();
}

function renderDashboard(name, phone){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="member-header">
      <div class="kicker">สมาชิกพระแสงเดลิเวอรี่</div>
      <h2>สวัสดีคุณ ${escapeHtml(name)} 👋</h2>
      <div class="phone">📱 ${escapeHtml(phone)}</div>
      <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div class="card">
      <h3 class="section-title">🎟️ คูปอง/โปรโมชั่นของฉัน</h3>
      <div id="couponsList" class="loading-text">กำลังโหลดคูปอง...</div>
    </div>

    <div class="card">
      <h3 class="section-title">📜 ประวัติการสั่งซื้อ</h3>
      <div id="orderHistoryList" class="loading-text">กำลังโหลดประวัติการสั่งซื้อ...</div>
    </div>
  `;

  loadCoupons(phone);
  loadOrderHistory(phone);
}

async function loadCoupons(phone){
  const box = document.getElementById("couponsList");
  try {
    const coupons = await apiGet('getMemberCoupons', { phone: phone });
    if(!coupons || coupons.length === 0){
      box.innerHTML = '<div class="empty-state">ยังไม่มีคูปองที่ใช้ได้ในตอนนี้<br>ติดตามโปรโมชั่นใหม่ๆ ได้เร็วๆ นี้ ✨</div>';
      return;
    }

    let html = "";
    coupons.forEach(function(c){
      const discountText = c.discountType === "percent"
        ? "ลด " + c.discountValue + "%"
        : "ลด " + c.discountValue + " บาท";
      const appliesText = c.appliesTo === "delivery" ? "ค่าจัดส่ง" : "ยอดสั่งซื้อ";

      html += `
        <div class="coupon-card">
          <div class="title">${escapeHtml(c.description || (discountText + appliesText))}</div>
          <div class="expiry">🏷️ ${discountText}${appliesText} · หมดอายุ ${escapeHtml(c.expiryDate)}</div>
          <button class="btn-gold" onclick="useCoupon('${escapeHtml(c.couponId)}')">ใช้คูปองนี้ตอนสั่งของ</button>
        </div>
      `;
    });
    box.innerHTML = html;
  } catch(error){
    box.innerHTML = '<div class="empty-state">โหลดคูปองไม่สำเร็จ: ' + escapeHtml(error.message) + '</div>';
  }
}

function useCoupon(couponId){
  localStorage.setItem("pd_selectedCouponId", couponId);
  alert("เลือกคูปองนี้ไว้แล้ว ✅\nไปหน้าสั่งของแล้วดูส่วนลดในตะกร้าได้เลย");
  window.location.href = "index.html";
}

async function loadOrderHistory(phone){
  const box = document.getElementById("orderHistoryList");
  try {
    const orders = await apiGet('getMemberOrderHistory', { phone: phone });
    if(!orders || orders.length === 0){
      box.innerHTML = '<div class="empty-state">ยังไม่มีประวัติการสั่งซื้อ<br>เริ่มสั่งครั้งแรกเพื่อรับส่วนลดค่าส่ง 50% ได้เลย!</div>';
      return;
    }

    let html = "";
    orders.forEach(function(o){
      let statusClass = "";
      if(String(o.status).indexOf("สำเร็จ") !== -1){ statusClass = "done"; }
      else if(String(o.status).indexOf("รอ") !== -1){ statusClass = "waiting"; }

      html += `
        <div class="order-card">
          <div class="top-row">
            <span class="order-id">#${escapeHtml(o.orderId)}</span>
            <span class="datetime">${escapeHtml(o.orderDate)} ${escapeHtml(o.orderTime)}</span>
          </div>
          <div class="shop">🏪 ${escapeHtml(o.shopName || "-")}</div>
          <div class="items">${escapeHtml(o.items)}</div>
          <div class="bottom-row">
            <span class="total">${Number(o.total).toLocaleString()} บาท</span>
            <span class="status-badge ${statusClass}">${escapeHtml(o.status || "-")}</span>
          </div>
        </div>
      `;
    });
    box.innerHTML = html;
  } catch(error){
    box.innerHTML = '<div class="empty-state">โหลดประวัติไม่สำเร็จ: ' + escapeHtml(error.message) + '</div>';
  }
}

loadHome();

</script>

</body>
</html>
