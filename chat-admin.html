<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>แชทแอดมิน - พระแสงเดลิเวอรี่</title>
<style>
  body{font-family:inherit;background:#fff0f6;margin:0;padding:16px;}
  .wrap{max-width:560px;margin:0 auto;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px;}
  h2{margin:0 0 10px;font-size:18px;}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-bottom:8px;}
  button{border:none;background:#ff2d87;color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;width:100%;}
  .th{background:#fafafa;border:1px solid #eee;color:#222;text-align:left;margin-top:8px;font-weight:600;}
  .th small{display:block;font-weight:400;color:#666;margin-top:2px;}
  #err{color:#d00;font-size:13px;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loginCard">
    <h2>🔐 แชทแอดมิน</h2>
    <input id="pin" type="password" placeholder="PIN แอดมิน">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <div id="err"></div>
  </div>

  <div id="mainArea" style="display:none;">
    <div class="card">
      <h2>💬 ห้องแชทลูกค้า</h2>
      <div id="threads">กำลังโหลด...</div>
    </div>
    <div class="card">
      <h2>✉️ เปิดห้องด้วยเลขออเดอร์</h2>
      <input id="manualOrder" placeholder="เช่น PC1234 หรือเลขออเดอร์อาหาร">
      <button onclick="openManual()">เปิดแชท</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="chat.js"></script>
<script>
let adminPin = "";
let listTimer = null;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

async function login(){
  const pin = document.getElementById("pin").value.trim();
  if(!pin) return;
  document.getElementById("err").textContent = "";
  try{
    await apiGet("chatListThreads", { role:"admin", pin:pin });
    adminPin = pin;
    try{ sessionStorage.setItem("pd_adminChatPin", pin); }catch(e){}
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("mainArea").style.display = "block";
    refreshThreads();
    listTimer = setInterval(function(){ if(!document.hidden) refreshThreads(); }, 8000);
  }catch(err){
    document.getElementById("err").textContent = err.message || String(err);
  }
}

async function refreshThreads(){
  try{
    const data = await apiGet("chatListThreads", { role:"admin", pin:adminPin });
    const box = document.getElementById("threads");
    if(!data.threads.length){ box.innerHTML = '<p style="color:#888;">ยังไม่มีข้อความ</p>'; return; }
    box.innerHTML = data.threads.map(function(t){
      const who = t.lastSender === "customer" ? "🟠 ลูกค้า: " : "คุณ: ";
      return '<button class="th" data-oid="'+esc(t.orderId)+'">ออเดอร์ '+esc(t.orderId)+'<small>'+who+esc(String(t.lastText).slice(0,70))+'</small></button>';
    }).join("");
    box.querySelectorAll("button[data-oid]").forEach(function(b){
      b.onclick = function(){ openThread(b.getAttribute("data-oid")); };
    });
  }catch(err){
    document.getElementById("threads").innerHTML = '<p style="color:#d00;">'+esc(err.message||err)+'</p>';
  }
}

function openThread(orderId){
  ChatUI.open({ role:"admin", orderId:orderId, channel:"admin", pin:adminPin, title:"💬 แชทกับลูกค้า" });
}
function openManual(){
  const id = document.getElementById("manualOrder").value.trim();
  if(!id){ alert("กรอกเลขออเดอร์"); return; }
  openThread(id);
}
window.onChatClosed = function(){ if(adminPin) refreshThreads(); };

(function(){
  try{ const p = sessionStorage.getItem("pd_adminChatPin"); if(p){ document.getElementById("pin").value = p; login(); } }catch(e){}
})();
</script>
</body>
</html>
