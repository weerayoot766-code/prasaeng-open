<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการร้านค้า - พระแสงเดลิเวอรี่</title>

<style>
body{ font-family:Arial;font-size:20px; background:#faf5ff; padding:20px; }
.card{ background:#fff; border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
h1,h2{ color:#7c3aed; }
button{ width:100%; background:#7c3aed; color:white; border:none; border-radius:10px; padding:12px; font-size:16px; cursor:pointer; margin-top:8px; }
input,select,textarea{ width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:16px; box-sizing:border-box; margin-top:8px; font-family:Arial; }
.back-btn{ background:#555; }

.store-header{
  background:linear-gradient(135deg,#a855f7,#7c3aed); border-radius:20px; padding:20px;
  color:#fff; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;
}
.store-header .info b{ display:block; font-size:18px; }
.store-header .info span{ font-size:13px; opacity:.85; }
.logout-btn{ width:auto; background:rgba(255,255,255,.25); padding:8px 14px; font-size:13px; margin:0; }

.store-toggle-card{ border-radius:14px; padding:14px; text-align:center; font-weight:700; cursor:pointer; margin-bottom:10px; }
.store-toggle-card.is-open{ background:#e6f9ee; color:#1a9c52; border:2px solid #1a9c52; }
.store-toggle-card.is-closed{ background:#fdeaea; color:#d63333; border:2px solid #d63333; }

.prod-row{ border:1px solid #eee; border-radius:12px; padding:10px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
.prod-row img{ width:60px; height:60px; object-fit:cover; border-radius:8px; background:#f5f5f5; }
.prod-row .info{ flex:1; }
.prod-row .edit-btn{ width:auto; background:#ff9900; margin:0; font-size:12px; padding:8px 10px; }
.prod-row .delete-btn{ width:auto; background:#e53935; margin:0; font-size:12px; padding:8px 10px; }
.prod-row-out{ opacity:.6; background:#faf5f5; }
.stock-toggle-btn{ width:auto; margin:0; font-size:11px; padding:8px 10px; white-space:nowrap; border:none; border-radius:8px; cursor:pointer; }
.stock-toggle-btn.in-stock{ background:#e6f9ee; color:#1a9c52; }
.stock-toggle-btn.out-stock{ background:#fdeaea; color:#d63333; }
</style>
</head>
<body>

<button class="back-btn" onclick="goHome()">← กลับหน้าแรก</button>

<div id="app"></div>

<script src="api.js"></script>
<script>

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function goHome(){
  window.location.href = "index.html";
}

let currentStoreId = "";
// ============================================================
// 🖼️ รูปจากเว็บฝากรูปฟรี (imgbb / postimg) → โหลดผ่านตัวแคชรูป wsrv.nl (เก็บสำเนา + ย่อรูป + ไม่โดนจำกัดตาม IP ร้าน)
// ถ้า wsrv.nl ใช้ไม่ได้/รูปไม่ขึ้น จะถอยกลับไปโหลดจากลิงก์ต้นทางตรงๆ อัตโนมัติ (ดู listener ด้านล่าง)
// ============================================================
function imgUrl_(url, w){
  url = String(url || "");
  if(!/^https?:\/\/(i\.)?(ibb\.co|postimg\.cc)\//i.test(url)){ return url; }
  return "https://wsrv.nl/?url=" + encodeURIComponent(url) + "&w=" + (w || 400) + "&output=webp&q=82";
}
window.addEventListener("error", function(ev){
  const el = ev.target;
  if(!el || el.tagName !== "IMG" || el.dataset.imgFb){ return; }
  const m = /^https:\/\/wsrv\.nl\/\?url=([^&]+)/.exec(el.src || "");
  if(m){ el.dataset.imgFb = "1"; try { el.src = decodeURIComponent(m[1]); } catch(e){} }
}, true);

let currentPin = "";
let currentStoreName = "";
// 🆕 หมวดสินค้า: ร้านทั่วไปใช้ชุดเดิม / ร้านฝากหิ้วเซเว่นใช้ชุดหมวดแบบในเซเว่น (ค่าที่เก็บเป็นข้อความธรรมดา ไม่มีอีโมจิ)
const CATS_GENERAL = ["อาหาร","เครื่องดื่ม","ของใช้ในบ้าน","ยาและสุขภาพ","ขนม","อาหารสด","ไข่ไก่","อุปกรณ์ไอที","เครื่องสำอาง","อื่นๆ"];
const CATS_SEVEN = [
  ["🍱","ข้าวกล่อง/อาหารพร้อมทาน"],["🥪","แซนด์วิช/เบเกอรี่"],["🍞","ขนมปัง"],["🌭","ของทอด/ไส้กรอก/เคาน์เตอร์ร้อน"],
  ["🍜","บะหมี่/โจ๊ก/อาหารสำเร็จรูป"],["🥫","อาหารสำเร็จรูป"],["🍚","อาหารแห้ง"],["🧂","เครื่องปรุง"],["🍿","ขนมขบเคี้ยว"],["🍫","ช็อกโกแลต/ลูกอม/หมากฝรั่ง"],["🍦","ไอศกรีม"],
  ["🧊","อาหารแช่แข็ง"],["🥛","นม/โยเกิร์ต"],["🥤","น้ำอัดลม/น้ำหวาน"],["💧","น้ำดื่ม/น้ำแร่"],
  ["🧃","ชา/กาแฟ/เครื่องดื่มชูกำลัง"],["☕","เครื่องดื่มชงสด"],["🥚","ไข่/ของสด"],
  ["🧴","ของใช้ส่วนตัว (สบู่ แชมพู ยาสีฟัน)"],["🧼","ผลิตภัณฑ์ซักล้าง/ทำความสะอาด"],["🧻","ทิชชู/ผ้าอนามัย/ผ้าอ้อม"],
  ["💊","ยาสามัญประจำบ้าน/สุขภาพ"],["💄","เครื่องสำอาง/ความงาม"],["👶","ของใช้เด็ก"],["🐶","อาหารสัตว์เลี้ยง"],
  ["✏️","เครื่องเขียน/อุปกรณ์สำนักงาน"],["🔌","อุปกรณ์ไอที/ถ่านไฟฉาย/สายชาร์จ"],["🧰","ของใช้ในบ้าน"],["🎁","อื่นๆ"]
];
function isSevenShop_(name){ return /เซเว่น|7[\s-]?eleven/i.test(String(name || "")); }
/** สร้างตัวเลือกหมวด (selected = ค่าปัจจุบัน — ถ้าเป็นหมวดเก่าที่ไม่อยู่ในลิสต์ จะเพิ่มให้เลือกคงไว้ได้) */
function categoryOptionsHtml_(shopName, selected, withPlaceholder){
  let h = withPlaceholder ? '<option value="">-- เลือกหมวดสินค้า --</option>' : "";
  const seven = isSevenShop_(shopName);
  const list = seven ? CATS_SEVEN : CATS_GENERAL.map(function(c){ return ["", c]; });
  let found = false;
  list.forEach(function(it){
    const v = it[1], isSel = (selected && v === selected);
    if(isSel) found = true;
    h += '<option value="' + escapeHtml(v) + '"' + (isSel ? ' selected' : '') + '>' + (it[0] ? it[0] + ' ' : '') + escapeHtml(v) + '</option>';
  });
  if(selected && !found){ h += '<option value="' + escapeHtml(selected) + '" selected>' + escapeHtml(selected) + ' (หมวดเดิม)</option>'; }
  return h;
}

let myProductsCache = {};

function loadHome(){
  const savedId = localStorage.getItem("pd_shopStoreId");
  const savedPin = localStorage.getItem("pd_shopPin");

  if(savedId && savedPin){
    tryLogin(savedId, savedPin, true);
  } else {
    renderLoginForm();
  }
}

function renderLoginForm(message){
  let html = '<h1>🏪 จัดการร้านค้า</h1>';
  html += '<div class="card">';
  if(message){
    html += '<p style="color:#d63333;font-weight:bold;">' + escapeHtml(message) + '</p>';
  }
  html += '<p style="color:#666;font-size:14px;">กรอกรหัสร้านและ PIN ที่ได้รับตอนสมัครร้านค้า — ระบบจะจำไว้ให้ ไม่ต้องกรอกใหม่ทุกครั้ง</p>';
  html += '<input id="loginStoreId" placeholder="รหัสร้าน 8 หลัก">';
  html += '<input id="loginPin" placeholder="PIN 4 หลัก">';
  html += '<button onclick="submitLogin()">เข้าสู่ระบบจัดการร้าน</button>';
  html += '</div>';
  document.getElementById("app").innerHTML = html;
}

function submitLogin(){
  const storeId = document.getElementById("loginStoreId").value.trim();
  const pin = document.getElementById("loginPin").value.trim();

  if(!storeId || !pin){
    alert("กรุณากรอกรหัสร้านและ PIN ให้ครบ");
    return;
  }
  tryLogin(storeId, pin, false);
}

async function tryLogin(storeId, pin, isAutoLogin){
  document.getElementById("app").innerHTML = "กำลังตรวจสอบ...";

  try {
    const result = await apiGet('verifyStore', { storeId: storeId, pin: pin });
    if(!result.success){
      localStorage.removeItem("pd_shopStoreId");
      localStorage.removeItem("pd_shopPin");
      renderLoginForm(isAutoLogin ? "" : "รหัสร้านหรือ PIN ไม่ถูกต้อง");
      return;
    }

    currentStoreId = storeId;
    currentPin = pin;
    currentStoreName = result.storeName;

    localStorage.setItem("pd_shopStoreId", storeId);
    localStorage.setItem("pd_shopPin", pin);

    loadDashboard();
  } catch(error){
    renderLoginForm("เชื่อมต่อไม่สำเร็จ: " + error.message);
  }
}

function logout(){
  if(!confirm("ออกจากระบบจัดการร้านนี้?")) return;
  localStorage.removeItem("pd_shopStoreId");
  localStorage.removeItem("pd_shopPin");
  currentStoreId = "";
  currentPin = "";
  renderLoginForm();
}

async function loadDashboard(){
  try {
    const result = await apiGet('getProductsByStore', { storeId: currentStoreId, pin: currentPin });
    if(!result.success){
      localStorage.removeItem("pd_shopStoreId");
      localStorage.removeItem("pd_shopPin");
      renderLoginForm("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่");
      return;
    }
    renderDashboard(result);
  } catch(error){
    alert("โหลดข้อมูลไม่สำเร็จ: " + error.message);
  }
}

function renderDashboard(result){
  myProductsCache = {};
  result.products.forEach(function(p){ myProductsCache[p.rowIndex] = p; });

  let html = '';

  // 🆕 header ใส่โลโก้ร้าน (ถ้ามี) ไว้ข้างชื่อร้าน
  html += '<div class="store-header" style="justify-content:flex-start;gap:14px;">';
  if(result.logo){
    html += '<img src="' + escapeHtml(imgUrl_(result.logo, 160)) + '" style="width:56px;height:56px;border-radius:14px;object-fit:cover;background:#fff;flex-shrink:0;">';
  }
  html += '<div class="info" style="flex:1;"><b>' + escapeHtml(currentStoreName) + '</b><span>รหัสร้าน: ' + escapeHtml(currentStoreId) + '</span></div>';
  html += '<button class="logout-btn" style="flex-shrink:0;" onclick="logout()">ออกจากระบบ</button>';
  html += '</div>';

  html += '<div class="' + (result.isOpen ? "store-toggle-card is-open" : "store-toggle-card is-closed") + '" onclick="toggleStoreOpen(' + result.isOpen + ')">';
  html += result.isOpen ? '🟢 ร้านเปิดอยู่ — กดเพื่อปิดร้าน' : '🔴 ร้านปิดอยู่ — กดเพื่อเปิดร้าน';
  html += '</div>';

  html += hoursCardHtml_(result.hours);

  // 🆕 เชื่อมแจ้งเตือนออเดอร์ผ่าน LINE OA
  const lineCmd = 'ผูก ' + currentStoreId + ' ' + currentPin;
  html += '<div class="card"><h2>🔔 แจ้งเตือนออเดอร์ทาง LINE</h2>';
  html += '<p style="color:#666;font-size:14px;line-height:1.6;">เมื่อลูกค้าชำระเงินและแอดมินตรวจสลิปผ่านแล้ว ระบบจะส่งรายละเอียดออเดอร์เข้า LINE ของคุณ<br>';
  html += '1) กดปุ่มเพิ่มเพื่อน LINE ด้านล่าง<br>2) คัดลอกข้อความนี้ไปพิมพ์ส่งในแชทนั้น:</p>';
  html += '<input id="lineCmdBox" readonly value="' + escapeHtml(lineCmd) + '" onclick="this.select()" style="text-align:center;font-weight:bold;">';
  html += '<button onclick="copyLineCmd()" style="background:#888;margin-bottom:8px;">📋 คัดลอกข้อความ</button>';
  html += '<button onclick="window.open(\'https://line.me/R/ti/p/@138kkxmm\', \'_blank\')" style="background:#06c755;">➕ เพิ่มเพื่อน LINE พระแสงเดลิเวอรี่</button>';
  html += '</div>';

  // 🆕 ปุ่มโปรโมทร้าน — พาไปหน้าเรทโฆษณา
  html += '<button onclick="window.location.href=\'ads.html\'" style="background:linear-gradient(135deg,#ffb703,#fb8500);margin-bottom:10px;">📢 โปรโมทร้าน</button>';

  // 🆕 การ์ดจัดการโลโก้ร้าน
  html += '<div class="card"><h2>🖼️ โลโก้ร้าน</h2>';
  html += '<p style="color:#666;font-size:14px;">โลโก้นี้จะแสดงในหน้ารายชื่อร้านค้าให้ลูกค้าเห็น</p>';
  if(result.logo){
    html += '<img src="' + escapeHtml(imgUrl_(result.logo, 240)) + '" style="width:100px;height:100px;object-fit:cover;border-radius:14px;margin-bottom:10px;background:#f5f5f5;">';
  }
  html += '<input type="file" id="logoFile" accept="image/*">';
  html += '<button onclick="submitLogo()" style="background:#2ecc71;">💾 บันทึกโลโก้ร้าน</button>';
  html += '</div>';

  html += '<div class="card"><h2>➕ เพิ่มเมนู/สินค้าใหม่</h2>';
  html += '<select id="productCategory">' + categoryOptionsHtml_(currentStoreName, "", true) + '</select>';
  html += '<input id="productName" placeholder="ชื่อสินค้า เช่น ข้าวกะเพราไก่">';
  html += '<input id="productPrice" type="number" placeholder="ราคา เช่น 50">';
  html += '<input type="file" id="productImageFile" accept="image/*">';
  html += '<input id="productDescription" placeholder="รายละเอียดสินค้า">';
  html += '<button onclick="submitNewProduct()">ส่งเมนูให้แอดมินตรวจ</button>';
  html += '</div>';

  html += '<div class="card"><h2>📋 สินค้าของร้านฉัน</h2>' +
    '<div style="display:flex;gap:8px;align-items:stretch;margin-bottom:6px;">' +
      '<input id="prodSearch" type="search" placeholder="🔎 ค้นหาสินค้า (ชื่อ / หมวด)" style="flex:1 1 0;width:auto;min-width:0;margin:0;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyProductSearch_();}" oninput="applyProductSearch_()">' +
      '<button type="button" onclick="applyProductSearch_()" style="flex:0 0 auto;width:auto;margin:0;padding:0 18px;">ค้นหา</button>' +
      '<button type="button" onclick="clearProductSearch_()" style="flex:0 0 auto;width:auto;margin:0;padding:0 14px;background:#999;">ล้าง</button>' +
    '</div><div id="prodSearchInfo" style="font-size:13px;color:#888;margin:0 2px 8px;"></div>' +
    '<div id="myProductList"></div></div>';

  document.getElementById("app").innerHTML = html;
  renderMyProducts(result.products);
}

// ================= 🕘 ตั้งเวลาเปิด-ปิดร้าน =================
const HRS_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const HRS_ORDER = [1,2,3,4,5,6,0];
function hoursCardHtml_(hours){
  let h = '<div class="card"><h2>🕘 เวลาเปิด-ปิดร้าน</h2>';
  h += '<p style="color:#666;font-size:14px;line-height:1.6;">ลูกค้าจะเห็นเวลานี้ที่หน้าร้าน และสั่งไม่ได้นอกเวลา<br>ถ้าไม่ตั้งเวลา = เปิดตลอด (ใช้ปุ่มเปิด/ปิดร้านด้านบนอย่างเดียว)</p>';
  h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;">';
  h += '<input type="time" id="hrsQuickOpen" value="08:00" style="margin:0;"><span>ถึง</span><input type="time" id="hrsQuickClose" value="17:00" style="margin:0;">';
  h += '<button type="button" onclick="hrsFillAll()" style="margin:0;width:auto;padding:10px 12px;background:#888;white-space:nowrap;">ใส่ทุกวัน</button></div>';
  HRS_ORDER.forEach(function(d){
    const v = hours && hours[String(d)] ? String(hours[String(d)]) : "";
    const m = /^(\d{2}:\d{2})-(\d{2}:\d{2})$/.exec(v);
    const on = !!m;
    h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">';
    h += '<label style="width:92px;font-weight:700;display:flex;align-items:center;gap:6px;"><input type="checkbox" id="hrsOn' + d + '" ' + (on ? 'checked' : '') + ' style="width:auto;margin:0;" onchange="hrsToggle(' + d + ')">' + HRS_DAYS[d] + '</label>';
    h += '<input type="time" id="hrsO' + d + '" value="' + (m ? m[1] : '08:00') + '" style="margin:0;"' + (on ? '' : ' disabled') + '>';
    h += '<span>–</span>';
    h += '<input type="time" id="hrsC' + d + '" value="' + (m ? m[2] : '17:00') + '" style="margin:0;"' + (on ? '' : ' disabled') + '>';
    h += '</div>';
  });
  h += '<p style="color:#888;font-size:12.5px;">เอาติ๊กออก = หยุดวันนั้น · ถ้าเวลาปิดน้อยกว่าเวลาเปิด (เช่น 18:00–02:00) = ปิดหลังเที่ยงคืน</p>';
  h += '<button onclick="saveHours()" style="background:#2ecc71;">💾 บันทึกเวลาเปิด-ปิด</button>';
  h += '<button onclick="clearHours()" style="background:#aaa;">ยกเลิกเวลา (เปิดตลอด)</button>';
  h += '</div>';
  return h;
}
function hrsToggle(d){
  const on = document.getElementById("hrsOn" + d).checked;
  document.getElementById("hrsO" + d).disabled = !on;
  document.getElementById("hrsC" + d).disabled = !on;
}
function hrsFillAll(){
  const o = document.getElementById("hrsQuickOpen").value, c = document.getElementById("hrsQuickClose").value;
  if(!o || !c){ alert("กรุณาเลือกเวลาเปิดและปิด"); return; }
  for(let d = 0; d < 7; d++){
    document.getElementById("hrsOn" + d).checked = true;
    document.getElementById("hrsO" + d).value = o;
    document.getElementById("hrsC" + d).value = c;
    hrsToggle(d);
  }
}
async function saveHours(){
  const obj = {}; let any = false;
  for(let d = 0; d < 7; d++){
    if(document.getElementById("hrsOn" + d).checked){
      const o = document.getElementById("hrsO" + d).value, c = document.getElementById("hrsC" + d).value;
      if(!o || !c){ alert("กรุณาเลือกเวลาเปิด/ปิดของวัน" + HRS_DAYS[d]); return; }
      obj[String(d)] = o + "-" + c; any = true;
    } else { obj[String(d)] = ""; }
  }
  if(!any){ alert("ต้องเปิดอย่างน้อย 1 วัน (ถ้าไม่ต้องการจำกัดเวลา กด 'ยกเลิกเวลา')"); return; }
  try {
    const res = await apiPost('setStoreHours', { storeId: currentStoreId, pin: currentPin, hours: JSON.stringify(obj) });
    if(!res.success){ alert(res.message || "บันทึกไม่สำเร็จ"); return; }
    alert("บันทึกเวลาเปิด-ปิดแล้ว ✅ (ลูกค้าจะเห็นภายในไม่กี่นาที)");
    loadDashboard();
  } catch(e){ alert("บันทึกไม่สำเร็จ: " + e.message); }
}
async function clearHours(){
  if(!confirm("ยกเลิกเวลาเปิด-ปิด? ร้านจะเปิดตลอด (ควบคุมด้วยปุ่มเปิด/ปิดร้านอย่างเดียว)")) return;
  try {
    const res = await apiPost('setStoreHours', { storeId: currentStoreId, pin: currentPin, hours: "" });
    if(!res.success){ alert(res.message || "ไม่สำเร็จ"); return; }
    loadDashboard();
  } catch(e){ alert("ไม่สำเร็จ: " + e.message); }
}

async function toggleStoreOpen(currentlyOpen){
  const newStatus = !currentlyOpen;
  try {
    const result = await apiPost('setStoreOpenStatus', { storeId: currentStoreId, pin: currentPin, isOpen: newStatus });
    if(!result.success){ alert("เปลี่ยนสถานะไม่สำเร็จ"); return; }
    loadDashboard();
  } catch(error){
    alert("เปลี่ยนสถานะไม่สำเร็จ: " + error.message);
  }
}

/** 🆕 บันทึก/เปลี่ยนโลโก้ร้าน — บีบอัดรูปก่อนส่งเหมือนรูปสินค้า แล้วยิงไป updateStoreLogo */
function submitLogo(){
  const file = document.getElementById("logoFile").files[0];
  if(!file){ alert("กรุณาเลือกรูปโลโก้ก่อน"); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = async function(){
      const canvas = document.createElement("canvas");
      const maxWidth = 400;
      const scale = maxWidth / img.width;
      canvas.width = maxWidth;
      canvas.height = img.height * scale;
      { const ctx_ = canvas.getContext("2d"); ctx_.fillStyle = "#ffffff"; ctx_.fillRect(0, 0, canvas.width, canvas.height); ctx_.drawImage(img, 0, 0, canvas.width, canvas.height); }
      const base64 = canvas.toDataURL("image/jpeg", 0.7).split(",")[1];

      try {
        const res = await apiPost('updateStoreLogo', { storeId: currentStoreId, pin: currentPin, logoBase64: base64 });
        if(!res.success){ alert(res.message || "บันทึกโลโก้ไม่สำเร็จ"); return; }
        alert("บันทึกโลโก้ร้านแล้ว ✅");
        loadDashboard();
      } catch(error){
        alert("บันทึกโลโก้ไม่สำเร็จ: " + error.message);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function copyLineCmd(){
  const box = document.getElementById("lineCmdBox");
  if(!box) return;
  box.select();
  try {
    if(navigator.clipboard){ navigator.clipboard.writeText(box.value); } else { document.execCommand("copy"); }
    alert("คัดลอกแล้ว ✅ นำไปวางในแชท LINE");
  } catch(e){ alert("กรุณากดค้างที่ช่องข้อความแล้วคัดลอกเอง"); }
}


// 🆕 เตรียมรูปสินค้า: ย่อรูปแบบทนทาน (object URL, พื้นขาว, ไม่ค้าง) — พังเมื่อไหร่ใช้ไฟล์เดิมถ้าไม่ใหญ่เกิน
function readFileDataUrl_(file){
  return new Promise(function(resolve, reject){
    const r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error("อ่านไฟล์ไม่ได้")); };
    r.readAsDataURL(file);
  });
}
function prepProductImage_(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    let done = false, url = "";
    function finish(fn, v){ if(done) return; done = true; clearTimeout(tm); try { if(url) URL.revokeObjectURL(url); } catch(e){} fn(v); }
    async function fallback(why){
      if(file.size <= 2.5 * 1024 * 1024){
        try { finish(resolve, await readFileDataUrl_(file)); return; } catch(e){}
      }
      finish(reject, new Error(why + " — ลองถ่ายรูปใหม่ หรือเลือกรูปที่เล็กกว่านี้"));
    }
    const tm = setTimeout(function(){ if(!done){ fallback("ย่อรูปใช้เวลานานเกินไป"); } }, 20000);
    try {
      url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function(){
        try {
          const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          if(!w || !h){ fallback("อ่านรูปไม่ได้"); return; }
          const scale = Math.min(1, maxWidth / w);
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const out = canvas.toDataURL("image/jpeg", quality);
          if(!out || out.length < 200 || out.indexOf("data:image/jpeg") !== 0){ fallback("ย่อรูปไม่สำเร็จ"); return; }
          finish(resolve, out);
        } catch(e){ fallback("ย่อรูปไม่สำเร็จ"); }
      };
      img.onerror = function(){ fallback("เครื่องอ่านรูปนี้ไม่ได้"); };
      img.src = url;
    } catch(e){ fallback("เปิดรูปไม่ได้"); }
  });
}
function withTimeout_(p, ms, msg){
  return new Promise(function(resolve, reject){
    const t = setTimeout(function(){ reject(new Error(msg)); }, ms);
    p.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}
let isSubmittingProduct = false;
async function submitNewProduct(ev){
  if(isSubmittingProduct) return;
  const category = document.getElementById("productCategory").value;
  const name = document.getElementById("productName").value;
  const price = document.getElementById("productPrice").value;
  const file = document.getElementById("productImageFile").files[0];
  const description = document.getElementById("productDescription").value;

  if(name === ""){ alert("กรุณากรอกชื่อสินค้า"); return; }
  if(price === ""){ alert("กรุณากรอกราคา"); return; }
  if(!file){ alert("กรุณาเลือกรูปสินค้า"); return; }
  isSubmittingProduct = true;
  const btn = (ev && ev.target) || document.querySelector('button[onclick="submitNewProduct()"]');
  const oldTxt = btn ? btn.textContent : "";
  function setBtn(t, dis){ if(btn){ btn.textContent = t; btn.disabled = !!dis; } }
  setBtn("⏳ กำลังเตรียมรูป...", true);
  let sent = false;
  try {
    const image = await prepProductImage_(file, 600, 0.6);
    setBtn("⏳ กำลังส่งเมนู...", true);
    sent = true;
    const sp = await withTimeout_(apiPost('submitProduct', {
      data: { shop: currentStoreName, category: category, name: name, price: price, image: image, description: description }
    }), 90000, "TIMEOUT");
    if(sp && sp.imageOk === false){
      alert("บันทึกเมนูแล้ว ⚠️ แต่รูปอัปโหลดไม่สำเร็จ\nกรุณากด ✏️ แก้ไข ที่เมนูนี้ แล้วอัปรูปใหม่อีกครั้ง");
    } else {
      alert("ส่งเมนูแล้ว ✅ รอแอดมินอนุมัติ");
    }
    loadDashboard();
  } catch(error){
    if(sent && (error.message === "TIMEOUT" || /failed to fetch|load failed|networkerror/i.test(error.message))){
      alert("เน็ตช้า ยังไม่รู้ผลการส่ง ⚠️\nอย่าเพิ่งกดส่งซ้ำ — รอสักครู่แล้วดูในรายการเมนูของร้านว่ามีเมนูนี้ขึ้นหรือยัง\nถ้ายังไม่มี ค่อยส่งใหม่อีกครั้ง");
      try { loadDashboard(); } catch(e){}
    } else {
      alert("ส่งเมนูไม่สำเร็จ: " + error.message);
    }
  } finally {
    isSubmittingProduct = false;
    setBtn(oldTxt || "ส่งเมนูให้แอดมินตรวจ", false);
  }
}

/** 🆕 ค้นหาสินค้าของร้านฉัน (กรองในหน้าจอ ไม่ยิงเซิร์ฟเวอร์) — ตรงกับชื่อ หมวด หรือรายละเอียด */
function applyProductSearch_(){
  const inp = document.getElementById("prodSearch"), info = document.getElementById("prodSearchInfo");
  if(!inp) return;
  const q = inp.value.trim().toLowerCase();
  let shown = 0, total = 0;
  Object.keys(myProductsCache).forEach(function(k){
    const p = myProductsCache[k], row = document.getElementById("prodRow_" + p.rowIndex);
    if(!row) return;
    total++;
    const hay = (String(p.name || "") + " " + String(p.category || "") + " " + String(p.description || "")).toLowerCase();
    const ok = !q || hay.indexOf(q) >= 0;
    row.style.display = ok ? "" : "none";
    if(ok) shown++;
  });
  if(info){ info.textContent = q ? (shown ? ('พบ ' + shown + ' จาก ' + total + ' รายการ') : ('ไม่พบสินค้าที่ตรงกับ "' + inp.value.trim() + '"')) : ''; }
}
function clearProductSearch_(){ const inp = document.getElementById("prodSearch"); if(inp){ inp.value = ""; applyProductSearch_(); inp.focus(); } }

function renderMyProducts(products){
  const box = document.getElementById("myProductList");

  if(products.length === 0){
    box.innerHTML = "<p>ยังไม่มีสินค้าในร้าน</p>";
    return;
  }

  let html = "";
  products.forEach(function(p){
    const inStock = p.inStock !== false; // 🆕 ค่าเริ่มต้น = มีสินค้า
    html +=
      '<div id="prodRow_' + p.rowIndex + '" class="prod-row' + (inStock ? '' : ' prod-row-out') + '">' +
        '<img src="' + escapeHtml(imgUrl_(p.image || "", 200)) + '">' +
        '<div class="info">' +
          '<b>' + escapeHtml(p.name) + '</b><br>' +
          '<span>' + Number(p.price) + ' บาท | ' + escapeHtml(p.category || "") + '</span><br>' +
          '<span style="color:#888;font-size:13px;">สถานะ: ' + escapeHtml(p.status || "") + '</span>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">' +
          '<div style="display:flex;gap:6px;">' +
            '<button class="edit-btn" onclick="startEditProduct(' + p.rowIndex + ')">✏️ แก้ไข</button>' +
            '<button class="delete-btn" onclick="deleteMyProduct(' + p.rowIndex + ')">🗑️ ลบ</button>' +
          '</div>' +
          '<button class="stock-toggle-btn ' + (inStock ? 'in-stock' : 'out-stock') + '" onclick="toggleProductStock(' + p.rowIndex + ', ' + inStock + ')">' +
            (inStock ? '🟢 มีสินค้า' : '🔴 หมดชั่วคราว') +
          '</button>' +
        '</div>' +
      '</div>';
  });
  box.innerHTML = html;
  try { applyProductSearch_(); } catch(e){}
}

/** 🆕 สลับสถานะสินค้าหมดชั่วคราว/มีสินค้า ทีละชิ้น */
async function toggleProductStock(rowIndex, currentlyInStock){
  const newStock = !currentlyInStock;
  try {
    const res = await apiPost('setProductStock', { rowIndex: rowIndex, storeId: currentStoreId, pin: currentPin, inStock: newStock });
    if(!res.success){ alert(res.message || "อัปเดตไม่สำเร็จ"); return; }
    loadDashboard();
  } catch(error){
    alert("อัปเดตไม่สำเร็จ: " + error.message);
  }
}

/** 🗑️ ลบเมนูอาหาร (ถามยืนยันก่อน, กันกดซ้ำ) */
let isDeletingProduct = false;
async function deleteMyProduct(rowIndex){
  if(isDeletingProduct) return;
  const p = myProductsCache[rowIndex];
  if(!p){ alert("ไม่พบสินค้า กรุณารีเฟรชหน้า"); return; }
  if(!confirm('ต้องการลบเมนู "' + p.name + '" ใช่ไหม?\nลบแล้วกู้คืนไม่ได้')) return;
  isDeletingProduct = true;
  const row = document.getElementById("prodRow_" + rowIndex);
  if(row) row.style.opacity = "0.5";
  try {
    const res = await apiPost('deleteProduct', { rowIndex: rowIndex, productName: p.name, storeId: currentStoreId, pin: currentPin });
    if(!res.success){ alert(res.message || "ลบไม่สำเร็จ"); if(row) row.style.opacity = ""; }
    else { loadDashboard(); }
  } catch(error){
    alert("ลบไม่สำเร็จ: " + error.message);
    if(row) row.style.opacity = "";
  } finally {
    isDeletingProduct = false;
  }
}

function startEditProduct(rowIndex){
  const p = myProductsCache[rowIndex];
  const card = document.getElementById("prodRow_" + rowIndex);

  card.innerHTML =
    '<div style="width:100%;">' +
      '<input id="editName_' + rowIndex + '" value="' + escapeHtml(p.name) + '" placeholder="ชื่อสินค้า">' +
      '<input id="editPrice_' + rowIndex + '" type="number" value="' + Number(p.price) + '" placeholder="ราคา">' +
      '<select id="editCategory_' + rowIndex + '">' + categoryOptionsHtml_(p.shop || currentStoreName, p.category || "", false) + '</select>' +
      '<input id="editDescription_' + rowIndex + '" value="' + escapeHtml(p.description || "") + '" placeholder="รายละเอียดสินค้า">' +
      '<input type="file" id="editImageFile_' + rowIndex + '" accept="image/*">' +
      '<p style="font-size:12px;color:#888;">(ไม่เลือกไฟล์ = ใช้รูปเดิม)</p>' +
      '<button onclick="saveEditedProduct(' + rowIndex + ')" style="background:#2ecc71;">💾 บันทึก</button>' +
      '<button onclick="loadDashboard()" style="background:#999;">ยกเลิก</button>' +
    '</div>';

}

function saveEditedProduct(rowIndex){
  const p = myProductsCache[rowIndex];
  const name = document.getElementById("editName_" + rowIndex).value;
  const price = document.getElementById("editPrice_" + rowIndex).value;
  const category = document.getElementById("editCategory_" + rowIndex).value;
  const description = document.getElementById("editDescription_" + rowIndex).value;
  const file = document.getElementById("editImageFile_" + rowIndex).files[0];

  if(name === "" || price === ""){ alert("กรุณากรอกชื่อสินค้าและราคา"); return; }

  async function doSave(imageBase64){
    try {
      const result = await apiPost('updateProduct', { data: {
        rowIndex: rowIndex, shop: p.shop, category: category, name: name, price: price,
        description: description, image: imageBase64 || ""
      }});
      if(!result.success){ alert(result.message || "บันทึกไม่สำเร็จ"); return; }
      alert("บันทึกสินค้าแล้ว ✅");
      loadDashboard();
    } catch(error){
      alert("บันทึกไม่สำเร็จ: " + error.message);
    }
  }

  if(file){
    if(window.__editSaving){ return; }
    window.__editSaving = true;
    prepProductImage_(file, 600, 0.6).then(function(b64){
      return withTimeout_(doSave(b64), 90000, "ใช้เวลานานเกินไป ลองตรวจรายการเมนูแล้วค่อยบันทึกใหม่");
    }).catch(function(e){
      alert("บันทึกไม่สำเร็จ: " + e.message);
    }).then(function(){ window.__editSaving = false; });
  } else {
    doSave("");
  }
}

window.addEventListener("load", loadHome);
